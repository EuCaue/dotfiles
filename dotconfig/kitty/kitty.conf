# Espelha o dotconfig/ghostty/config
include theme.conf

font_family monospace
bold_font auto
italic_font auto
bold_italic_font auto
# Ghostty aplica o text-scaling-factor do GNOME (1.15): 13.3 * 1.15
font_size 15.3
adjust_line_height 0
adjust_column_width -1
text_composition_strategy legacy
# Ghostty usa Symbols Nerd Font como fallback; fixa os icones no mesmo tamanho
symbol_map U+E000-U+F8FF Symbols Nerd Font
symbol_map U+F0000-U+FFFFD Symbols Nerd Font
symbol_map U+100000-U+10FFFD Symbols Nerd Font
cursor_shape block
cursor_blink_interval 0.5
cursor_trail 150
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

background_opacity 1
window_padding_width 2
remember_window_size no
initial_window_width 195c
initial_window_height 45c

mouse_hide_wait 0

enable_audio_bell no
visual_bell_duration 0.1

strip_trailing_spaces smart
paste_actions quote-urls-at-prompt,confirm
confirm_os_window_close 0

shell_integration enabled

# Prefixo tmux-like: alt+shift+w
map --new-mode w --timeout 1.5 alt+shift+w
map --mode w backslash combine : launch --location=vsplit --cwd=current : pop_keyboard_mode
map --mode w minus combine : launch --location=hsplit --cwd=current : pop_keyboard_mode
map --mode w c combine : new_tab : pop_keyboard_mode
map --mode w n combine : next_tab : pop_keyboard_mode
map --mode w p combine : previous_tab : pop_keyboard_mode
map --mode w q combine : close_window : pop_keyboard_mode
map --mode w m combine : toggle_layout stack : pop_keyboard_mode
map --mode w equal combine : goto_layout splits : pop_keyboard_mode
map --mode w r combine : reload_config : pop_keyboard_mode
map --mode w h combine : resize_window narrower 2 : pop_keyboard_mode
map --mode w j combine : resize_window shorter 2 : pop_keyboard_mode
map --mode w k combine : resize_window taller 2 : pop_keyboard_mode
map --mode w l combine : resize_window wider 2 : pop_keyboard_mode

# Navegacao entre splits sem conflitar com readline
map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right

map ctrl+comma edit_config_file
map ctrl+shift+r reload_config
map ctrl+shift+plus change_font_size all +6
map ctrl+shift+minus change_font_size all 17
map ctrl+shift+e
map ctrl+shift+o
map ctrl+shift+w
