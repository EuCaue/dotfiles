session_name: zk
start_directory: ${XDG_DOCUMENTS_DIR}/zk

windows:
  - window_name: zk
    panes:
      - zsh

  - window_name: INBOX
    panes:
      - nvim INBOX.md

  - window_name: daily
    panes:
      - nvim +'/##.*Today' +'nohlsearch' "$(zk-todo open)"

  - window_name: zk-2
    panes:
      - git status

  - window_name: notes
    start_directory: ${XDG_DOCUMENTS_DIR}/notes
    panes:
      - zsh
